name: Solo 3D tests
on:
  push:
    branches: [main, feature/solo-3d-movement]
  pull_request:
jobs:
  syntax-and-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile solo mode
        run: python -m compileall -q solo3d
      - name: Run solo game-state unit tests
        run: python -m unittest discover -s tests -p 'test_solo3d.py' -v
