name: Solo 3D tests
on:
  push:
    branches: [main, feature/first-person-flexible-arms]
  pull_request:
jobs:
  syntax-and-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile solo mode
        run: python -m compileall -q solo3d
      - name: Run solo game-state unit tests
        run: python -m unittest discover -s tests -p 'test_solo3d.py' -v
      - name: Head dodge and camera smoothing tests
        run: python -m unittest discover -s tests -p 'test_head_dodge.py' -v
      - name: Test actual camera-to-XZ synthetic motion and occlusion
        run: python -m unittest discover -s tests -p 'test_tracking_v2.py' -v

      - name: Catch SoloPose runtime variable regressions
        run: python -m unittest discover -s tests -p 'test_pose_source.py' -v
      - name: Anatomical L/R wrist and camera mapping regression
        run: python -m unittest discover -s tests -p 'test_anatomical_hands.py' -v
      - name: Test full robot pose retargeting
        run: python -m unittest discover -s tests -p 'test_robot_shadow.py' -v
      - name: Test first-person articulated arm tracking
        run: python -m unittest discover -s tests -p 'test_first_person_arms.py' -v
